[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tuneagent"
version = "0.2.0"
description = "A local, pluggable music discovery agent for a crawler course project."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
ui = ["gradio>=5"]
real = ["netease-encode-api==1.2.3", "requests>=2.32,<3"]
agent = [
  "openai>=1",
  "prompt-toolkit>=3",
  "python-dotenv>=1",
  "rich>=13",
  "tomli>=2; python_version<'3.11'",
]
cookie = ["browser-cookie3>=0.20"]
all = [
  "browser-cookie3>=0.20",
  "gradio>=5",
  "netease-encode-api==1.2.3",
  "openai>=1",
  "prompt-toolkit>=3",
  "pytest>=8",
  "python-dotenv>=1",
  "requests>=2.32,<3",
  "rich>=13",
  "tomli>=2; python_version<'3.11'",
]

[tool.setuptools.packages.find]
include = ["tuneagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
