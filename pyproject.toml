[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tuneagent"
version = "0.2.0"
description = "A local, pluggable music discovery agent for a crawler course project."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
ui = ["gradio>=5"]

[tool.setuptools.packages.find]
include = ["tuneagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
